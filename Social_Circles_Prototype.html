<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CircleSafe — Interactive Prototype</title><style>
:root{font-family:Inter,system-ui,Arial;background:#e8edf3;color:#15243c}*{box-sizing:border-box}body{margin:0}.shell{max-width:440px;min-height:100vh;margin:auto;background:#f8fafc;box-shadow:0 0 30px #8da0b54d;padding-bottom:84px}header{background:#142f47;color:white;padding:22px 20px 16px;position:sticky;top:0;z-index:2}header h1{font-size:23px;margin:0}header small{color:#a8d6d4}main{padding:18px}h2{font-size:20px;margin:4px 0 12px}h3{font-size:16px;margin:10px 0}p{line-height:1.45}.muted{color:#617084;font-size:13px}.card{background:white;border:1px solid #dce5ed;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 10px #22334409}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#e1f4ef;color:#176c62;border-radius:30px;padding:5px 9px;font-size:12px;font-weight:700}.btn{background:#147d78;color:white;border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer}.btn.secondary{background:#e7edf3;color:#20374a}.btn.danger{background:#ffe5e5;color:#9b2929}.btn:disabled{opacity:.4}.audience-control{width:100%;text-align:left;min-height:48px}.section-help{margin:0 0 16px}.notice:focus{outline:2px solid #147d78;outline-offset:3px}button{cursor:pointer}input,textarea,select{width:100%;padding:12px;border:1px solid #b9c8d4;border-radius:10px;font:inherit;margin:7px 0 12px;background:white}label{font-size:14px;font-weight:650}.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f5}.check input{width:20px;height:20px;margin:0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);display:flex;background:#fff;border-top:1px solid #dce5ed;z-index:3}.nav button{flex:1;background:white;border:0;padding:13px 4px;color:#58697a;font-size:12px}.nav button.active{color:#0a7971;font-weight:800}.notice{background:#e6f5f2;border-left:4px solid #14827c;padding:12px;border-radius:9px;margin-bottom:12px}.notice strong{display:block;margin-bottom:3px}.warning{background:#fff0d6;border-left:4px solid #c48b1b;padding:12px;border-radius:9px;margin:12px 0}.tag{display:inline-block;background:#edf2f7;padding:5px 9px;margin:3px;border-radius:8px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1}.avatar{background:#d9e9f0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:700}.person{display:flex;align-items:center;gap:10px}.divider{height:1px;background:#e5ebf0;margin:12px 0}.topline{display:flex;justify-content:space-between;align-items:center}.hidden{display:none}</style><div class="shell"><header><div class="topline"><div><small>TEAM 13 · INTERACTIVE DEMO</small><h1>◉ CircleSafe</h1></div><span style="font-size:25px">🔒</span></div></header><main id="app"></main><nav class="nav" id="nav"></nav></div><script>
const people=['Alex Chen','Maya Patel','Jordan Lee','Taylor Kim','Sam Rivera','Morgan Reed','Casey Brown','Riley Shah'];
let circles=[{id:1,name:'Close Friends',members:[0,1,2],visible:true,discover:false},{id:2,name:'Family',members:[3,4],visible:true,discover:false},{id:3,name:'School',members:[2,5,6],visible:true,discover:true},{id:4,name:'Work',members:[6,7],visible:false,discover:false}];
let posts=[{id:1,text:'Weekend plans with friends ☀️',audience:[1],date:'Today'},{id:2,text:'School project update 📚',audience:[3],date:'Yesterday'}];
let page='feed',editing=null,form=null,composer={text:'',audience:[]},selectedPost=null,notice='';
const app=document.getElementById('app'),nav=document.getElementById('nav');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=id=>circles.find(c=>c.id===id);const names=ids=>ids.map(id=>get(id)?.name).filter(Boolean).join(', ')||'Nobody';const count=ids=>new Set(ids.flatMap(id=>get(id)?.members||[])).size;
function go(p){page=p;notice='';render()}function flash(t,p){notice=t;page=p;render()}function setField(k,v){form[k]=v}function toggleMember(i){form.members=form.members.includes(i)?form.members.filter(x=>x!==i):[...form.members,i];render()}function toggleAudience(id){composer.audience=composer.audience.includes(id)?composer.audience.filter(x=>x!==id):[...composer.audience,id];render()}
function edit(id){editing=id;let c=get(id);form=c?{...c,members:[...c.members]}:{id:Date.now(),name:'',members:[],visible:true,discover:false};go('editor')}
function saveCircle(){let name=document.getElementById('circleName').value.trim();if(!name){alert('Please enter a circle name');return}form.name=name;let index=circles.findIndex(c=>c.id===form.id);if(index<0)circles.push({...form});else circles[index]={...form};flash('Circle “'+name+'” '+(index<0?'created':'updated')+' successfully. '+form.members.length+' '+(form.members.length===1?'member':'members')+' saved.','circles')}
function saveSettings(){let c=get(editing);c.visible=document.getElementById('visible').checked;c.discover=document.getElementById('discover').checked;flash('Privacy settings saved for '+c.name+'. Sharing is '+(c.visible?'enabled':'paused')+' and account discovery is '+(c.discover?'on':'off')+'.','circles')}
function showPost(id){selectedPost=id;go('post')}
function render(){const activePage=({post:'feed',editor:'circles',settings:'privacy',preview:'compose',published:'compose'})[page]||page;nav.innerHTML=[['feed','⌂','Feed'],['circles','◎','Circles'],['compose','＋','Post'],['privacy','⚙','Privacy']].map(([p,ic,n])=>`<button class="${activePage===p?'active':''}" onclick="${p==='compose'?'startCompose()':`go('${p}')`}">${ic}<br>${n}</button>`).join('');let s=notice?`<div class="notice" role="status" aria-live="polite" tabindex="-1">${esc(notice)}</div>`:'';
if(page==='feed'){s+=`<h2>Home feed</h2><p class="muted">Explore sample posts and check who can see them.</p>`+posts.slice().reverse().map(p=>`<div class="card"><div class="row"><b>My profile</b><span class="pill" aria-label="Post audience: ${esc(names(p.audience))}">Audience: ${esc(names(p.audience))}</span></div><p>${esc(p.text)}</p><p class="muted">${p.date}</p><button class="btn audience-control" aria-label="View audience details for ${esc(p.text)}" onclick="showPost(${p.id})">View audience details →<br><span style="font-weight:400">Who can see this post? ${esc(names(p.audience))}</span></button></div>`).join('')+`<button class="btn" onclick="startCompose()">Create a post</button>`}
if(page==='post'){let p=posts.find(x=>x.id===selectedPost);s+=`<button class="btn secondary" onclick="go('feed')">← Back to feed</button><h2>Post audience</h2><div class="card"><p>${esc(p.text)}</p><h3>Visible to</h3>${p.audience.map(id=>`<span class="tag">${esc(get(id)?.name||'Deleted circle')}</span>`).join('')}<p><b>${count(p.audience)} unique sample people</b> may see this post.</p><div class="divider"></div><h3>People included</h3>${[...new Set(p.audience.flatMap(id=>get(id)?.members||[]))].map(i=>`<div class="check">${esc(people[i])}</div>`).join('')||'No members'}</div>`}
if(page==='circles'){s+=`<div class="row"><h2>My circles</h2><button class="btn" onclick="edit(null)">+ New circle</button></div><p class="muted">Manage circle names and members here. To change sharing or account discovery, open Privacy in the bottom navigation.</p>`+circles.map(c=>`<div class="card"><div class="row"><h3>${esc(c.name)}</h3><span class="pill">${c.members.length} members</span></div><p class="muted">${c.members.map(i=>people[i]).join(', ')||'No members yet'}</p><p class="muted">Account discoverability: ${c.discover?'On':'Off'} · Sharing: ${c.visible?'Allowed':'Paused'}</p><div class="actions"><button class="btn secondary" onclick="edit(${c.id})">Edit name &amp; members</button></div></div>`).join('')}
if(page==='editor'){s+=`<button class="btn secondary" onclick="go('circles')">← Circles</button><h2>${editing?'Edit circle':'Create circle'}</h2><div class="card"><label for="circleName">Circle name</label><input id="circleName" maxlength="35" oninput="setField('name',this.value)" value="${esc(form.name)}" placeholder="e.g. Sports Team"><h3>Select members</h3><p class="muted">Select people who should belong to this circle.</p>${people.map((p,i)=>`<label class="check"><input type="checkbox" ${form.members.includes(i)?'checked':''} onchange="toggleMember(${i})">${esc(p)}</label>`).join('')}<div class="actions"><button class="btn" onclick="saveCircle()">Save circle</button><button class="btn secondary" onclick="go('circles')">Cancel</button></div></div>`}
if(page==='privacy'){s+=`<h2>Circle privacy settings</h2><p class="muted">Manage sharing and account discovery here. To change a circle’s name or members, open Circles in the bottom navigation. These privacy settings are simulated.</p>`+circles.map(c=>`<div class="card"><div class="row"><b>${esc(c.name)}</b><span class="pill">${c.discover?'Discoverable':'Hidden'}</span></div><p class="muted">${c.visible?'Posting enabled':'Posting paused'} · ${c.members.length} members</p><button class="btn secondary" onclick="settings(${c.id})">Edit privacy settings</button></div>`).join('')}
if(page==='settings'){let c=get(editing);s+=`<button class="btn secondary" onclick="go('privacy')">← Privacy</button><h2>${esc(c.name)} preferences</h2><div class="card"><label class="check"><input type="checkbox" id="visible" ${c.visible?'checked':''}> Allow sharing posts with this circle</label><p class="muted">When disabled, this circle cannot be selected for new posts.</p><label class="check"><input type="checkbox" id="discover" ${c.discover?'checked':''}> Allow account discovery through this circle</label><p class="muted">When on, people connected through this circle may receive a suggestion to view your profile. When off, this circle will not be used for profile suggestions.</p><div class="warning">Changes here do not alter privacy settings in any real social media app.</div><button class="btn" onclick="saveSettings()">Save preferences</button></div>`}
if(page==='compose'){s+=`<h2>Create a post</h2><div class="card"><label for="postText">Your post</label><textarea id="postText" rows="4" placeholder="What would you like to share?" oninput="composer.text=this.value">${esc(composer.text)}</textarea><h3>Choose audience circles</h3>${circles.map(c=>`<label class="check" style="opacity:${c.visible?1:.5}"><input type="checkbox" ${composer.audience.includes(c.id)?'checked':''} ${!c.visible?'disabled':''} onchange="toggleAudience(${c.id})">${esc(c.name)} ${!c.visible?'(sharing paused)':''}</label>`).join('')}<div class="notice">Selected audience: ${esc(names(composer.audience))}<br>${count(composer.audience)} unique sample people</div><button class="btn" onclick="preview()">Preview audience →</button></div>`}
if(page==='preview'){s+=`<h2>Review before sharing</h2><div class="card"><h3>Your post</h3><p>${esc(composer.text)}</p><div class="divider"></div><h3>Who can see this?</h3>${composer.audience.map(id=>`<span class="tag">${esc(get(id)?.name)}</span>`).join('')}<p><b>${count(composer.audience)} unique people</b> in your selected circles.</p><h3>Audience members</h3>${[...new Set(composer.audience.flatMap(id=>get(id)?.members||[]))].map(i=>`<div class="check">${esc(people[i])}</div>`).join('')||'None'}<div class="warning">Check this list carefully before publishing. People may belong to multiple circles.</div><div class="actions"><button class="btn secondary" onclick="go('compose')">Edit audience</button><button class="btn" onclick="publish()">Confirm & publish</button></div></div>`}
if(page==='published'){s+=`<div class="card"><h2>✓ Post shared</h2><p>Your simulated post was added to the feed with your selected audience.</p><div class="actions"><button class="btn" onclick="go('feed')">View post in feed</button><button class="btn secondary" onclick="startCompose()">New post</button></div></div>`}
app.innerHTML=s;if(notice){app.querySelector('[role=status]')?.focus();window.scrollTo({top:0,behavior:'smooth'});}}
function settings(id){editing=id;go('settings')}function startCompose(){composer={text:'',audience:[]};go('compose')}function preview(){composer.text=document.getElementById('postText').value.trim();if(!composer.text){alert('Write a post before continuing');return}if(!composer.audience.length){alert('Choose at least one audience circle');return}go('preview')}function publish(){posts.push({id:Date.now(),text:composer.text,audience:[...composer.audience],date:'Just now'});go('published')}render();
</script></html>
